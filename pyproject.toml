[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-finetune"
version = "0.1.0"
description = "Fine-tune Laya, the open System One decision model, for any typed-decision task: synthetic data, RLCD, calibration and long context."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "zamax14"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["laya", "fine-tuning", "system-one", "rlcd", "calibration", "long-context", "yarn", "synthetic-data"]
# torch with CUDA: pip install -e . --extra-index-url https://download.pytorch.org/whl/cu130
dependencies = [
    "laya==0.3.20",
    "torch>=2.5",
    "transformers>=5",  # 4.x ignores YaRN: the context would not really grow past 8192.
    "ollama>=0.6",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/zamax14/Laya-Finetune"
Repository = "https://github.com/zamax14/Laya-Finetune"
Issues = "https://github.com/zamax14/Laya-Finetune/issues"

[project.scripts]
layaft = "layaft.cli:main"

[tool.setuptools.packages.find]
include = ["layaft*"]
