# Context prefiltering for Claude Code: is this installed skill, rule, agent or MCP tool useful for the request?
# One yes/no question per candidate, the candidate inside the question, as claude-decide asks it: Claude Code only
# gets the items that pass, instead of reading every description of a crowded setup. The candidates come from a
# catalog of public items (prefilter/collect.py, synthesize.py), so the model learns to read descriptions, not names.

name: context_prefilter

fields:
  request: {single_line: true}             # What the person typed.
  step: {required: false, single_line: true}  # Empty on a new message; "Current step: <Tool> <input>" after a tool.
  type: {}                                 # From the pool: skill, rule, agent or mcp.
  name: {}
  description: {}

state:
  request: "{request}"
  step: "{step}"

questions:
  needed:
    type: noul
    name: Needed
    # Exactly claude-decide's QUESTION (scorer.py): the model is used with this text.
    instructions: "Is this Claude Code {type} useful for handling the user's request? {type} «{name}»: {description}"
    words: {true: useful, false: NOT useful}

generation:
  text_field: request
  id_fields: [request, step, type, name]   # One request is paired with many candidates: each pair is its own case.
  per_call: 5
  pool: {file: prefilter/pool_train.jsonl, fields: [type, name, description]}
  contexts: prefilter/contexts.txt
  default_context: a full-stack web application
  leak_phrases: ["«", "»", ": true", ": false"]
  weights:
    - {needed: true, weight: 0.6}
    - {needed: false, weight: 0.4}
  vary:
    language: [Spanish, English, English, Spanish, Portuguese, "Spanish with English technical terms"]
    length: ["very short, 2 to 8 words", "very short, 2 to 8 words", "short, 8 to 20 words", "20 to 50 words, with details"]
    step:
      - "`step` is empty: the person just sent the message"
      - "`step` is empty: the person just sent the message"
      - "`step` is the tool Claude Code just ran while working on the message, as 'Current step: <Tool> <input>' (e.g. 'Current step: Bash npm test', 'Current step: Edit src/api/users.ts'); judge the item for what Claude does next"
    miss:  # Only for NOT useful: most are near misses, some need nothing at all.
      - "it is about something close (same technology, domain or kind of task) but this item would not help"
      - "it is about something close (same technology, domain or kind of task) but this item would not help"
      - "it is about something close (same technology, domain or kind of task) but this item would not help"
      - "it needs no installed item at all: a greeting, thanks, a quick opinion or a general knowledge question"
  prompt: |-
    Write {n} different messages that a developer types to Claude Code while working on {context}.
    Claude Code has this {type} installed: «{name}»: {description}
    For every message, this {type} must be {needed.label} to handle it.

    In this batch:
    - Language: {language}.
    - Messages {length}.
    - {step}.

    Rules:
    - useful: the message's goal needs what this {type} provides, even if the message never names it ("the login screen looks off on mobile" needs a frontend design skill).
    - NOT useful: {miss}.
    - Write as real people do: sometimes terse and messy, sometimes detailed. Do not name the item, and do not write "skill", "agent", "rule" or "MCP" unless a real person would.
    - Different from these: {seen}.
  filler_prompt: |-
    Write {n} excerpts of an earlier Claude Code session while working on {context}: user turns, assistant replies,
    tool calls and their outputs (file reads, test runs, diffs, command output). Each one 300 to 600 words, already
    finished, with no pending request.

data:
  train: ../data/context_prefilter.jsonl
  test: prefilter/test_heldout.jsonl   # Generated on the held-out catalog and verified by both judges; never trained on.
  filler: ../data/context_prefilter_filler.jsonl
