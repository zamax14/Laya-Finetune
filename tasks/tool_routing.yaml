# Tool / MCP routing: decide which tools an agent needs before the LLM is called.
# The agent sends the conversation and the latest message; Laya answers in one pass whether to use tools, ask the
# user or answer directly, and which tools (several can be needed at once). A cheap, calibrated gate: the LLM only
# gets the tools it needs, and low confidence can fall back to exposing every tool.

name: tool_routing

fields:
  history: {required: false, min_words: 6}  # 0–4 earlier turns: they may carry what the message takes for granted ("send it to him").
  message: {}                                # What the person writes now: often a few words.

state:
  conversation: "{history}"
  message: "{message}"

questions:
  action:
    type: choice
    name: Action
    instructions: >-
      What should the assistant do with the latest `message`, given the `conversation`?
    review: {green: 80, yellow: 60}  # Below green, expose every tool to the LLM instead of trusting the routing.
    options:
      use_tools:
        label: Usar herramientas
        criteria: "use tools: needs live or external data, the user's calendar, mail or files, an internal database, or an action in a system"
      ask_user:
        label: Preguntar al usuario
        criteria: "ask the user: something essential is missing or ambiguous (who, which file, which date) and the conversation does not say it"
      answer_directly:
        label: Responder directamente
        criteria: "answer directly: greetings, thanks, rewriting, translating or summarizing text already in the conversation, stable general knowledge"
  web_search:
    type: noul
    name: Web search
    instructions: Does handling the `message` need a web search for current or public information (news, prices, weather, traffic, public websites)?
    words: {true: sí, false: "no"}
  calendar:
    type: noul
    name: Calendar
    instructions: Does handling the `message` need the user's calendar (reading, creating, moving or cancelling events, checking availability)?
    words: {true: sí, false: "no"}
  email:
    type: noul
    name: Email
    instructions: Does handling the `message` need the user's email (reading, searching, drafting or sending messages)?
    words: {true: sí, false: "no"}
  files:
    type: noul
    name: Files
    instructions: Does handling the `message` need the user's files or documents (finding, reading, saving or editing them in a drive or folder)?
    words: {true: sí, false: "no"}
  database:
    type: noul
    name: Database
    instructions: Does handling the `message` need a query to an internal database or system of record (sales, inventory, customers, tickets, metrics)?
    words: {true: sí, false: "no"}

exclude:
  # Asking or answering directly uses no tool…
  - {action: [ask_user, answer_directly], web_search: true}
  - {action: [ask_user, answer_directly], calendar: true}
  - {action: [ask_user, answer_directly], email: true}
  - {action: [ask_user, answer_directly], files: true}
  - {action: [ask_user, answer_directly], database: true}
  # …and using tools uses at least one.
  - {action: use_tools, web_search: false, calendar: false, email: false, files: false, database: false}

generation:
  text_field: message
  per_call: 5
  contexts: tool_routing_contexts.txt
  default_context: asistente de IA de una empresa mediana en México, usado por su personal
  # The real mix, not one case per combination: each tool a message needs multiplies its weight by 0.35, so one tool
  # is more common than two and five almost never happen. Shares: answer directly 20 %, ask the user 12 %, one tool
  # 34 %, two 24 %, three 8 %, four or five 2 %.
  weights:
    - {action: answer_directly, weight: 1.0}
    - {action: ask_user, weight: 0.6}
    - {web_search: true, weight: 0.35}
    - {calendar: true, weight: 0.35}
    - {email: true, weight: 0.35}
    - {files: true, weight: 0.35}
    - {database: true, weight: 0.35}
  vary:  # One option of each per call: every batch of 5 shares them, the dataset gets all of them.
    length:
      - muy cortos, de 1 a 8 palabras, como un chat rápido
      - muy cortos, de 1 a 8 palabras, como un chat rápido
      - cortos, de 8 a 20 palabras
      - cortos, de 8 a 20 palabras
      - de 20 a 40 palabras
      - largos, de 40 a 90 palabras, con detalles y contexto de sobra
    turns:
      - "`history` vacío: es el primer mensaje de la conversación"
      - "`history` vacío: es el primer mensaje de la conversación"
      - "`history` con 1 o 2 turnos previos"
      - "`history` con 1 o 2 turnos previos"
      - "`history` con 3 o 4 turnos previos, y la respuesta depende de algo dicho en ellos"
    style:
      - como escribe la gente con prisa, sin acentos y con alguna falta de ortografía
      - formal y cortés
      - coloquial, con modismos del país del contexto
      - directo, en imperativo
      - indirecto, describe lo que quiere lograr sin pedir una acción concreta
      - como pregunta
  prompt: |-
    Escribe {n} conversaciones distintas entre una persona y el asistente de IA de su trabajo, en el idioma del contexto (español si no indica otro).
    Contexto: {context}

    En cada una, el último mensaje de la persona (`message`) debe llevar a estas respuestas, solo por lo que dice la conversación:
    - ¿Qué debe hacer el asistente?: {action.label} ({action.criteria}).
    - ¿Necesita búsqueda web?: {web_search.label}.
    - ¿Necesita el calendario de la persona?: {calendar.label}.
    - ¿Necesita su correo?: {email.label}.
    - ¿Necesita sus archivos o documentos?: {files.label}.
    - ¿Necesita consultar una base de datos o sistema interno?: {database.label}.

    En este lote:
    - Mensajes {length}.
    - {turns}. Los turnos van en líneas separadas, con el formato «Usuario: …» y «Asistente: …».
    - Estilo: {style}.

    Reglas:
    - Una herramienta «no» no puede hacer falta, aunque el mensaje toque temas cercanos: hablar de un correo cuyo texto ya está en la conversación no necesita el correo; opinar sobre una reunión ya descrita no necesita el calendario; un dato que el asistente ya dio en `history` no se vuelve a buscar.
    - Una herramienta «sí» tiene que hacer falta de verdad, aunque el mensaje no la nombre: a veces se pide explícito («mándale un correo a…») y a veces se deduce («¿llego a tiempo a lo de Pedro si salgo a las 5?» necesita el calendario).
    - Responder directamente: saludos, gracias, reescribir, traducir o resumir texto que ya está en la conversación, cálculos, conocimiento general estable, opiniones y consejos.
    - Preguntar al usuario: pediría una herramienta, pero falta algo esencial (a quién, qué archivo, qué fecha, de qué cliente) y no aparece en toda la conversación.
    - Nada de nombres de herramientas ni de sistemas inventados de forma forzada; datos concretos y creíbles (nombres, fechas, montos, SKU, clientes).
    - Situaciones distintas de estas, que ya existen: {seen}.
  filler_prompt: |-
    Write {n} documents that could sit earlier in an AI assistant's context in this setting: {context}.
    They are already handled: earlier conversations that ended, tool results (search snippets, calendar listings,
    email threads, query tables), system notes. Each one of 300 to 600 words, in the language of the setting.
    None of them may contain a pending request.

data:
  # Hand-written, never trained on. Training data and filler use the defaults: data/tool_routing*.jsonl.
  test: tool_routing_test.jsonl
